[package]
name = "dynamicbar-core"
version = "1.0.0"
edition = "2021"
description = "Ядро DynamicBar: разбор логов DeepSeek Harness и сборка снимка для вкладки «Агент»"
license = "MIT"

[[bin]]
name = "dsh-core"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
